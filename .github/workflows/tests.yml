name: Tests

on:
    push:
    pull_request:

jobs:
    phpunit:
        name: PHPUnit
        runs-on: ubuntu-22.04

        strategy:
            matrix:
                php:
                    - '5.3'
                    - '5.4'
                    - '5.5'
                    - '5.6'
                    - '7.0'
                    - '7.1'
                    - '7.2'
                    - '7.3'
                    - '7.4'
                    - '8.0'
                    - '8.1'
                    - '8.2'
                    - '8.3'
                    - '8.4'
                    - '8.5'

        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    coverage: "none"
                    extensions: "pcre"
                    php-version: "${{ matrix.php }}"

            -   name: Composer
                uses: 'ramsey/composer-install@v3'

            -   name: Run tests
                run: ./vendor/bin/phpunit --colors=always
